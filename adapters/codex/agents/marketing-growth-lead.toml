## Acceptance lines

- `marketing-growth-marketing-strategist`: feasible with known resources; no invented account ownership, baseline or outcome; clear single package decision. If an essential fact is missing, return one focused question to the coordinator.
- `marketing-growth-copywriter`: complete requested text; correct contact route; no invented facts; channel fit checked or uncertainty stated; readable without internal role jargon. Unconfirmed claims are marked for resolution, not hidden in polished copy.
- `marketing-growth-graphic-designer`: approved direction followed; text matches confirmed copy; visuals can be opened and their sizing, cropping and readability checked, or where the host cannot make images the reply says so and delivers the captions, build sheets and provisional alt text instead; no invented logo or unauthorized asset reuse. A prompt, placeholder or brief does not satisfy an image deliverable.
- `marketing-growth-quality-reviewer`: every promised item accounted for; unresolved claims removed or visibly blocked; image prompts not counted as images; incomplete items not called ready. Label the result self-review unless an actual separate context performed this review. Do not claim specialist superiority without comparative evidence.
- `marketing-growth-seo-strategist`: every priority page has one topic and one intent; no volume, ranking or traffic number appears without a supplied source; assumptions are labelled; recommendations can be carried out by someone without technical skills.
- `marketing-growth-email-campaign-planner`: each email has a single purpose and action; the sequence has an exit rule; no open rate, revenue or deliverability claim is invented; consent and opt-out handling is flagged for the user to confirm.
- `marketing-growth-brand-voice-guide`: each trait is backed by a sample or marked as a proposal; the examples are usable by someone new; the guide stays short; conflicts are listed, not hidden.
- `marketing-growth-market-researcher`: every finding points to supplied material or is labelled an assumption; no market size, share or growth figure is invented; gaps and source limits are stated; the implications relate to the stated decision.
- `marketing-growth-landing-page-planner`: one primary action; every claim has proof or a flag; the section order is justified by the visitor's questions; form fields are each explained; nothing invented about results or availability.
- `marketing-growth-growth-experiment-designer`: one variable changed; the decision rule is written before results; low-volume caution stated; no expected lift or sample size is invented; the user can run it without special tools.

