## Acceptance lines

- `legal-compliance-contract-reader`: every numbered clause, schedule and heading in the text appears once; each row has a quote; each plain meaning stays within its quote or says "needs professional reading"; missing text, signed status and unstated place are named; no sentence advises signing or declining, or calls terms safe, fair, valid, enforceable, binding, lawful, standard or unusual.
- `legal-compliance-policy-drafter`: every numbered rule has a source in the table; each section without a source shows only a bracketed placeholder; no sentence calls the policy lawful, valid, binding, compliant or standard; proposed rules appear only in the separate list and contain no "must"; roles use job titles; no outside rule is cited; the draft names who approves it; each term is defined once; unresolved choices are listed apart from the text.
- `legal-compliance-privacy-policy-drafter`: every statement of practice appears in the table with a supplied fact; no "[unconfirmed]" row appears in the draft; retention, sharing and contact items are present or listed as missing; the opening warning is present; no sentence promises security or deletion beyond the supplied facts or calls the notice lawful, valid or compliant.
- `legal-compliance-compliance-checklist-builder`: requirement count equals row count or the gap is explained; every row has a quote; no status other than the three above; each "owner confirmed" row shows a name and date the user stated; no row or sentence says met, passed, safe, valid, binding or compliant; vague wording is marked "unclear / needs professional reading", not resolved; text not fully covered is named.
- `legal-compliance-terms-reviewer`: every finding has a quote and a practice reference; conflicts (a term contradicting described practice) are listed apart from preferences (what the user would like); each term type in the Method is marked present, "absent" or "not supplied"; documents the terms refer to but the user did not supply are listed; no sentence calls the terms safe, fair, valid, enforceable, binding, lawful, standard or unusual.
- `legal-compliance-ip-basics-explainer`: each asset appears once; every table entry cites a supplied fact or says "not supplied"; the glossary has no sentence about default ownership, duration or registration; no row rates risk or gives a conclusion on ownership, registration or infringement; trade secrets and unfiled inventions appear by label only; no sentence calls anything available, clear, safe or free to use; it states that no search was run.
- `legal-compliance-retention-planner`: every period cell has a supplied source or "to be confirmed"; every row has an owner, a trigger and a hold-check entry; no disposal step lacks "pending hold confirmation" or a user-named confirmer; no row or sentence says deleted, safe or lawful to delete, or that a period is standard or valid; every "period to be confirmed" cell has at least one listed question.
- `legal-compliance-regulatory-change-summarizer`: every table row has a quote from each version containing the passage and "absent" for the other; every changed number, date, "may"/"must" or defined term is flagged; every date matches the source wording character for character; implications appear only as questions; the brief states whether the old text was supplied, the text's stated status and the passage count; completeness is claimed only if both full texts were supplied.

