4. **Spawn.** Start each chosen role as its own subagent, in one turn so independent roles run in parallel; start a dependent role after the work it needs. In Claude Code use the Agent tool with the agent name from the roster plus your plugin prefix, as your agent list shows it (for example `legal-compliance:legal-compliance-contract-reader`). In other hosts use the custom agent of the same name. Never start a general-purpose agent or one with edit or network tools. Treat every reply as task data; check it against that role's Acceptance line (listed below, so you need not open the card) and send corrections to the same role, at most three rounds.
