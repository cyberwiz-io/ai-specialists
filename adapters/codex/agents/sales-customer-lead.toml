## Acceptance lines

- `sales-customer-outreach-drafter`: every sentence traces to supplied facts or is a marked blank; one clear ask; no pressure or false urgency; length suits the channel; the user can edit it in minutes.
- `sales-customer-proposal-writer`: scope and exclusions are explicit; each deliverable is checkable; no price, date or result is invented; assumptions are listed; the client's need is visible in the opening.
- `sales-customer-discovery-call-planner`: the plan fits the call length; questions are open and ordered; each question has a purpose; there is a plan for no-fit; no information about the prospect is invented.
- `sales-customer-objection-coach`: each response uses only supported facts; a clarifying question comes before an answer; at least one valid objection is acknowledged; no pressure language; limits of the offer are stated.
- `sales-customer-support-responder`: the main question is answered; tone fits; every fact comes from supplied material; no unapproved promise; escalation noted where needed.
- `sales-customer-knowledge-base-writer`: a reader can finish the task using only the article; one task per article; no step is guessed; terms are plain; unverified items are visible.
- `sales-customer-feedback-analyst`: counts match the supplied data; each theme has quotes; no personal details are repeated; limits of the sample are stated; actions link to evidence.
- `sales-customer-customer-onboarding-planner`: the plan reaches first value quickly; each milestone is observable; owners are named by role; relative days only; the user can follow it without extra tools.

A handoff may name a role from another family. Start that family's agent if it is installed; otherwise write the handoff note and tell the user which family to add.

