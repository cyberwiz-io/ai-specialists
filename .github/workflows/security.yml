# SPDX-License-Identifier: Apache-2.0
# Inexpensive security scans on pull requests only. Each tool covers something different and none of them alone
# shows the project is secure; see "Security checks" in CONTRIBUTING.md.
# Third-party tools are downloaded by exact version and verified against a pinned SHA-256 or image digest, and every
# action is pinned to a full commit SHA, as the organization requires.
name: security
on:
  pull_request:
  workflow_call:
    inputs:
      sha:
        required: true
        type: string
      base:
        required: true
        type: string
      pr:
        required: true
        type: string
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: ${{ github.workflow }}-security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
  GITLEAKS_DARWIN_SHA256: b40ab0ae55c505963e365f271a8d3846efbc170aa17f2607f13df610a9aeb6a5
  TRIVY_VERSION: 0.75.0
  TRIVY_SHA256: c6e65abddb348e25f10549df887045629cf28cc72453cd1c63acb717316b3f3f
  TRIVY_DARWIN_SHA256: 4a77108cccf8e55c8d6823e1e759939a622277e66cd0daa3c1fc621ed69e4568
  # semgrep/semgrep:1.180.0, linux/amd64
  SEMGREP_IMAGE: semgrep/semgrep@sha256:dffc9caeecc924370d30f9187b6edf10949600d3ef5f69ef5c359074d8fc7d2d
jobs:
  changes:
    if: ${{ vars.LOCAL_RELEASE_RUNNER == '' || github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    # Decides which scans the change needs, so edits to prose alone skip the code scans.
    runs-on: ${{ vars.LOCAL_RELEASE_RUNNER != '' && fromJSON(format('["self-hosted","macOS","ARM64","{0}"]', vars.LOCAL_RELEASE_RUNNER)) || 'ubuntu-24.04' }}
    timeout-minutes: 20
    outputs:
      code: ${{ steps.paths.outputs.code }}
      sensitive: ${{ steps.paths.outputs.sensitive }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          ref: ${{ inputs.sha || github.event.pull_request.head.sha }}
          persist-credentials: false
      - id: paths
        env:
          BASE: ${{ inputs.base || github.event.pull_request.base.sha }}
          HEAD: ${{ inputs.sha || github.event.pull_request.head.sha }}
        run: |
          git diff --name-only "$BASE...$HEAD" > changed.txt
          cat changed.txt
          code=false; sensitive=false
          grep -qvE '\.md$|^docs/|^LICENSES/' changed.txt && code=true
          grep -qE '^catalog/(security|finance|people-hr|legal-compliance)/|^catalog/families\.json$|^pack/FAMILY-COORDINATOR\.md$|^\.engineering/|^\.github/|^\.claude/|^scripts/|^config/|^VERSION$|^AGENTS\.md$|^CONTRIBUTING\.md$|^docs/(RELEASE|HOST-ACCEPTANCE)\.md$' changed.txt && sensitive=true
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then code=true; sensitive=true; fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "sensitive=$sensitive" >> "$GITHUB_OUTPUT"
  gitleaks:
    if: ${{ vars.LOCAL_RELEASE_RUNNER == '' || github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    # Secrets can land in any file, prose included, so this runs on every pull request.
    runs-on: ${{ vars.LOCAL_RELEASE_RUNNER != '' && fromJSON(format('["self-hosted","macOS","ARM64","{0}"]', vars.LOCAL_RELEASE_RUNNER)) || 'ubuntu-24.04' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          ref: ${{ inputs.sha || github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Install Gitleaks
        run: |
          platform=linux_x64
          if [ "$RUNNER_OS" = macOS ]; then
            platform=darwin_arm64
            GITLEAKS_SHA256="$GITLEAKS_DARWIN_SHA256"
          fi
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_${platform}.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | shasum -a 256 -c -
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Scan PR commits or the full release history for secrets
        env:
          BASE: ${{ inputs.base || github.event.pull_request.base.sha }}
          HEAD: ${{ inputs.sha || github.event.pull_request.head.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            range="$BASE..$HEAD"
          else
            # A PR base ref can advance after merge; scan all history reachable from the exact release candidate.
            range="$HEAD"
          fi
          ./gitleaks git --log-opts="$range" --redact --no-banner --exit-code 1 .
  semgrep:
    # Semgrep Community Edition through its open-source CLI: no Semgrep account or token.
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' && (vars.LOCAL_RELEASE_RUNNER == '' || github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ${{ vars.LOCAL_RELEASE_RUNNER != '' && fromJSON(format('["self-hosted","macOS","ARM64","{0}"]', vars.LOCAL_RELEASE_RUNNER)) || 'ubuntu-24.04' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.sha || github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        if: vars.LOCAL_RELEASE_RUNNER == '' && runner.os == 'macOS'
        with:
          python-version: '3.12'
      - name: Use task-local Python on Mac Studio
        if: vars.LOCAL_RELEASE_RUNNER != ''
        shell: bash
        run: |
          python3.12 -c "import platform, sys; assert sys.version_info[:2] == (3, 12) and platform.system() == 'Darwin' and platform.machine() == 'arm64', 'Native Mac ARM64 Python 3.12 required'"
          python_env="$(mktemp -d "$RUNNER_TEMP/python-3.12.XXXXXX")"
          python3.12 -m venv "$python_env"
          echo "$python_env/bin" >> "$GITHUB_PATH"
      - name: Install hash-locked native Semgrep
        if: runner.os == 'macOS'
        run: |
          python -m venv "$RUNNER_TEMP/semgrep"
          "$RUNNER_TEMP/semgrep/bin/python" -m pip --isolated install --disable-pip-version-check --require-hashes --only-binary=:all: -r config/semgrep-macos/requirements.txt
      - name: Scan scripts, tests and workflows on macOS
        if: runner.os == 'macOS'
        run: |
          "$RUNNER_TEMP/semgrep/bin/semgrep" scan --metrics=off --error \
            --config p/python --config p/github-actions \
            --exclude-rule python.lang.correctness.string-concat-in-list.string-concat-in-list \
            scripts tests .github
      - name: Scan scripts, tests and workflows on Linux
        if: runner.os != 'macOS'
        run: |
          docker run --rm -v "$PWD:/src" -w /src "$SEMGREP_IMAGE" semgrep scan --metrics=off --error \
            --config p/python --config p/github-actions \
            --exclude-rule python.lang.correctness.string-concat-in-list.string-concat-in-list \
            scripts tests .github
  trivy:
    # Filesystem mode: known-vulnerable dependencies and infrastructure or configuration mistakes.
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' && (vars.LOCAL_RELEASE_RUNNER == '' || github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ${{ vars.LOCAL_RELEASE_RUNNER != '' && fromJSON(format('["self-hosted","macOS","ARM64","{0}"]', vars.LOCAL_RELEASE_RUNNER)) || 'ubuntu-24.04' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.sha || github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Install Trivy
        run: |
          platform=Linux-64bit
          if [ "$RUNNER_OS" = macOS ]; then
            platform=macOS-ARM64
            TRIVY_SHA256="$TRIVY_DARWIN_SHA256"
          fi
          curl -sSfL -o trivy.tar.gz "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_${platform}.tar.gz"
          echo "${TRIVY_SHA256}  trivy.tar.gz" | shasum -a 256 -c -
          mkdir -p "$RUNNER_TEMP/trivy" && tar -xzf trivy.tar.gz -C "$RUNNER_TEMP/trivy" trivy
      - name: Scan dependencies and configuration
        run: |
          "$RUNNER_TEMP/trivy/trivy" fs --scanners vuln,misconfig --severity HIGH,CRITICAL \
            --ignore-unfixed --exit-code 1 --no-progress --format json --output "$RUNNER_TEMP/trivy.json" .
          python3 - <<'PYSCAN'
          import json, os, pathlib
          report = json.loads((pathlib.Path(os.environ['RUNNER_TEMP']) / 'trivy.json').read_text())
          if not report.get('Results'):
              raise SystemExit('Trivy found no supported targets; security coverage is unverified')
          targets = {item['Target'] for item in report['Results']}
          native_lock = 'config/semgrep-macos/requirements.txt'
          if pathlib.Path(native_lock).exists() and native_lock not in targets:
              raise SystemExit('Trivy did not scan the native Semgrep dependency lock')
          print('Trivy scanned targets:', sorted(targets))
          PYSCAN
  independent-review:
    needs: changes
    if: ${{ needs.changes.outputs.sensitive == 'true' && (vars.LOCAL_RELEASE_RUNNER == '' || github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ${{ vars.LOCAL_RELEASE_RUNNER != '' && fromJSON(format('["self-hosted","macOS","ARM64","{0}"]', vars.LOCAL_RELEASE_RUNNER)) || 'ubuntu-24.04' }}
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.sha || github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Verify authorized coordinator attestation of separate review
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ inputs.pr || github.event.pull_request.number }}
        run: |
          head=$(gh api "repos/$REPO/pulls/$PR" --jq .head.sha)
          python3 -B scripts/release_gate.py review --repo "$REPO" --pr "$PR" --sha "$head"
  security-acceptance:
    # This inline gate executes no checkout and fails when protected jobs were skipped.
    if: ${{ always() }}
    needs: [changes, gitleaks, semgrep, trivy, independent-review]
    runs-on: ${{ vars.LOCAL_RELEASE_RUNNER != '' && fromJSON(format('["self-hosted","macOS","ARM64","{0}"]', vars.LOCAL_RELEASE_RUNNER)) || 'ubuntu-24.04' }}
    timeout-minutes: 5
    steps:
      - name: Require scans and applicable independent review
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          jobs = json.loads(os.environ['RESULTS'])
          outputs = jobs['changes'].get('outputs', {})
          expected = {'changes': 'success', 'gitleaks': 'success',
                      'semgrep': 'success' if outputs.get('code') == 'true' else 'skipped',
                      'trivy': 'success' if outputs.get('code') == 'true' else 'skipped',
                      'independent-review': 'success' if outputs.get('sensitive') == 'true' else 'skipped'}
          bad = {name: job.get('result') for name, job in jobs.items()
                 if job.get('result') != expected[name]}
          print('Security results:', {name: job.get('result') for name, job in jobs.items()})
          sys.exit(bool(bad))
          PY
