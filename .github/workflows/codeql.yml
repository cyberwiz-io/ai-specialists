# SPDX-License-Identifier: Apache-2.0
# CodeQL scanning on pull requests only. This replaces GitHub's default setup, which also scans every push
# to main and on a weekly schedule. Results cannot upload while default setup is on, and the organization
# controls that setting, so the job runs only when the repository variable CODEQL_ADVANCED is 'true'. Set it
# after an organization admin turns default setup off (see "Security checks" in CONTRIBUTING.md).
name: codeql
on:
  pull_request:
permissions:
  contents: read
jobs:
  analyze:
    if: vars.CODEQL_ADVANCED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [actions, python]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: /language:${{ matrix.language }}
