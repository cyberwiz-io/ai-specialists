# SPDX-License-Identifier: Apache-2.0
# CodeQL scanning on pull requests only. This replaces GitHub's default setup, which also scans every push
# to main and on a weekly schedule. Results cannot upload while default setup is on, and the organization
# controls that setting, so the job runs only when the repository variable CODEQL_ADVANCED is 'true'. Set it
# after an organization admin turns default setup off (see "Security checks" in CONTRIBUTING.md).
name: codeql
on:
  pull_request:
  workflow_call:
    inputs:
      sha:
        required: true
        type: string
permissions:
  contents: read
jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    if: ${{ vars.CODEQL_ADVANCED == 'true' && (vars.LOCAL_RELEASE_RUNNER == '' || github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ${{ vars.LOCAL_RELEASE_RUNNER != '' && fromJSON(format('["self-hosted","macOS","ARM64","{0}"]', vars.LOCAL_RELEASE_RUNNER)) || 'ubuntu-24.04' }}
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [actions, python]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.sha || github.sha }}
          persist-credentials: false
      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: /language:${{ matrix.language }}
