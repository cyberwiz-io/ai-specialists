# SPDX-License-Identifier: Apache-2.0
name: release
# Dispatch only after explicit owner authorization, at the exact candidate ref.
on:
  workflow_dispatch:
    inputs:
      sha:
        description: Full reviewed main commit SHA (must equal the dispatch ref)
        required: true
        type: string
      tag:
        description: Existing version tag, for example v1.1
        required: true
        type: string
      pr:
        description: Merged PR with authorized independent-review attestation
        required: true
        type: string
permissions:
  contents: read
  pull-requests: read
  checks: read
concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  provenance:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      base: ${{ steps.pr.outputs.base }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind dispatch, tag, reviewed tree and main history
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ inputs.sha }}
          TAG: ${{ inputs.tag }}
          PR: ${{ inputs.pr }}
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          test "$SHA" = "$DISPATCH_SHA"
          python3 -B scripts/release_gate.py provenance --repo "$REPO" --pr "$PR" --sha "$SHA" --tag "$TAG"
          base=$(gh api "repos/$REPO/pulls/$PR" --jq .base.sha)
          echo "base=$base" >> "$GITHUB_OUTPUT"
  candidate-checks:
    needs: provenance
    uses: ./.github/workflows/check.yml
    with:
      sha: ${{ github.sha }}
  candidate-security:
    needs: provenance
    uses: ./.github/workflows/security.yml
    with:
      sha: ${{ github.sha }}
      base: ${{ needs.provenance.outputs.base }}
      pr: ${{ inputs.pr }}
  policy:
    name: policy-compliance
    needs: provenance
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -r config/requirements.txt
      - run: python .engineering/check.py
      - run: python -m unittest discover -s .engineering -p 'test_*.py'
  publish:
    needs: [provenance, candidate-checks, candidate-security, policy]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: read
      checks: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Recheck provenance and all exact-commit evidence
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ inputs.sha }}
          TAG: ${{ inputs.tag }}
          PR: ${{ inputs.pr }}
        run: python3 -B scripts/release_gate.py release --repo "$REPO" --pr "$PR" --sha "$SHA" --tag "$TAG"
      - name: Build and verify final assets
        env:
          TAG: ${{ inputs.tag }}
        run: |
          python3 -B scripts/pack.py release --tag "$TAG" --out work/release
          python3 -B scripts/verify_release.py work/release
      - name: Read versioned release notes
        env:
          TAG: ${{ inputs.tag }}
        run: |
          python3 - <<'PY'
          import os, pathlib, re
          version = os.environ['TAG'][1:]
          text = pathlib.Path('CHANGELOG.md').read_text()
          sections = re.split(r'^## ', text, flags=re.M)
          notes = next((s.split('\n', 1)[1].strip() for s in sections[1:] if s.split('\n', 1)[0] == version), '')
          if not notes:
              raise SystemExit('Missing versioned changelog notes')
          repo = os.environ['GITHUB_REPOSITORY']
          notes = notes.replace('](docs/', f'](https://github.com/{repo}/blob/{os.environ["TAG"]}/docs/')
          pathlib.Path('work/release-notes.md').write_text(notes + '\n')
          PY
      - name: Create release once, never overwrite
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release create "$TAG" work/release/*.zip work/release/SHA256SUMS work/release/RELEASE.json \
            --verify-tag --title "AI Specialists ${TAG#v}" --notes-file work/release-notes.md
