name: Engineering policy
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  policy:
    name: policy-compliance
    runs-on: ${{ vars.LOCAL_RELEASE_RUNNER != '' && fromJSON(format('["self-hosted","macOS","ARM64","{0}"]', vars.LOCAL_RELEASE_RUNNER)) || 'ubuntu-24.04' }}
    timeout-minutes: 5
    steps:
      - name: Reject external PR code on the local runner
        if: vars.LOCAL_RELEASE_RUNNER != '' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: exit 1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        if: vars.LOCAL_RELEASE_RUNNER == ''
        with:
          python-version: '3.12'
      - name: Use task-local Python on Mac Studio
        if: vars.LOCAL_RELEASE_RUNNER != ''
        shell: bash
        run: |
          python3.12 -c "import platform, sys; assert sys.version_info[:2] == (3, 12) and platform.system() == 'Darwin' and platform.machine() == 'arm64', 'Native Mac ARM64 Python 3.12 required'"
          python_env="$(mktemp -d "$RUNNER_TEMP/python-3.12.XXXXXX")"
          python3.12 -m venv "$python_env"
          echo "$python_env/bin" >> "$GITHUB_PATH"
      - run: python -m pip install --disable-pip-version-check -r config/requirements.txt
      - run: python .engineering/check.py
      - run: python -m unittest discover -s .engineering -p 'test_*.py'
