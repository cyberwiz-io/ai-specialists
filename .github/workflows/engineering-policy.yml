name: Engineering policy
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  policy:
    name: policy-compliance
    runs-on: ${{ vars.LOCAL_RELEASE_RUNNER != '' && fromJSON(format('["self-hosted","macOS","ARM64","{0}"]', vars.LOCAL_RELEASE_RUNNER)) || 'ubuntu-24.04' }}
    timeout-minutes: 5
    steps:
      - name: Reject external PR code on the local runner
        if: vars.LOCAL_RELEASE_RUNNER != '' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: exit 1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -r config/requirements.txt
      - run: python .engineering/check.py
      - run: python -m unittest discover -s .engineering -p 'test_*.py'
