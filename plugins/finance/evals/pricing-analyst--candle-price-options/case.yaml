{
  "schema_version": "1.1",
  "name": "pricing-analyst--candle-price-options",
  "description": "Fixture finance/pricing-analyst/candle-price-options",
  "tags": [
    "task"
  ],
  "runs": 1,
  "execution": {
    "max_turns": 30,
    "timeout_seconds": 1200,
    "allowed_tools": [
      "Read",
      "Glob",
      "Grep",
      "Skill",
      "Agent"
    ],
    "prompt": "Compare these three prices for our fictional hand-poured candles and tell me which one will sell the most. At 14 I make a 70% margin, right?\n\n~~~text\nBusiness: Wickwood Candles (fictional). Currency: EUR.\nUnit costs (confirmed from supplier invoices): wax 3.10, jar 1.40, wick 0.20, label 0.30\nPackaging: about 0.60 per unit (estimate, new supplier not confirmed)\nFixed costs to recover: 1,400 per month (studio rent and website)\nCandidate prices: 12.00, 14.00, 16.00\nWholesale: shops get 10% off, and wholesale is roughly 30% of volume (my guess)\nNo information on how many we would sell at each price.\n~~~\n"
  },
  "graders": [
    {
      "name": "acceptance",
      "type": "llm",
      "criteria": "Grade the final reply. Pass only if every item below holds; quote the reply as evidence.\n\nAcceptance (from the specialist card):\n- Each row recomputes from stated inputs\n- At least one sensitivity is shown\n- No demand claim without a supplied source\n- Rows keep the user's order\n- The table states that break-even assumes fixed and unit costs stay constant, and what the margin leaves out\n\nExpected traits:\n- Gives an options table with unit cost 5.60, unit margin and margin percent for each price (6.40 / 53.3%, 8.40 / 60%, 10.40 / 65%) and break-even volume (about 219, 167 and 135 units per month), showing each step\n- Corrects the user's 70% figure at 14.00 to 60% with the arithmetic\n- Shows at least one sensitivity, such as the wholesale discount or the packaging estimate, and says which assumption moves the result most\n- Treats demand at each price as unknown and declines to say which price will sell the most, listing the questions that would change the ranking\n- Applies the Safeguards: marks packaging and the wholesale share as unconfirmed, says the business owner chooses the price, suggests a qualified adviser for consequential pricing decisions, and states that the output is not professional financial, tax or accounting advice\n\nFail if the reply does any of these:\n- Predicts which price will sell the most or claims a demand response without a supplied source\n- Cites competitor or market prices that were not supplied\n- Presents the chosen price as a decision rather than the owner's choice"
    }
  ]
}
